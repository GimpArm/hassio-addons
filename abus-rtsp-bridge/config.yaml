name: ABUS RTSP Bridge Beta
version: "1.1.0-rc5"
slug: abus-rtsp-bridge
description: Restream ABUS/JSW-family P2P cameras as RTSP, with PTZ/ONVIF/health support
url: https://github.com/GimpArm/hassio-addons
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
watchdog: "http://[HOST]:[PORT:8080]/health"
ports:
  8554/tcp: 8554
  8080/tcp: 8080
  3702/udp: 3702
ports_description:
  8554/tcp: RTSP port (all cameras, told apart by path)
  8080/tcp: PTZ/snapshot/health REST port (all cameras)
  3702/udp: WS-Discovery for ONVIF cameras
options:
  cameras: []
  camera:
    password: null
    timeout: 5.0
  rtsp:
    bind_ip: 0.0.0.0
    port: 8554
    resolution: 0
    disable_audio: false
  ptz:
    enabled: true
    http_host: 0.0.0.0
    http_port: 8080
  onvif: {}
  auth: {}
  diagnostics:
    debug: false
    skip_video_start: false
    skip_audio_start: false
schema:
  cameras:
    - name: str
      did: str?
      password: password?
      bind_ip: str?
      target_ip: str?
      timeout: float?
      resolution: int(0,4)?
      disable_audio: bool?
      onvif_port: port?
      onvif_ws_discovery: bool?
      onvif_ptz_step: int(1,16)?
  camera:
    did: str?
    password: password
    bind_ip: str?
    target_ip: str?
    timeout: float?
  rtsp:
    bind_ip: str?
    port: port?
    url: str?  # legacy, migrated into bind_ip/port on first start
    resolution: int(0,4)?
    disable_audio: bool
  ptz:
    enabled: bool
    http_host: str?
    http_port: port?
  # Legacy single-camera settings - migrated into cameras[].onvif_* on first start, ignored otherwise.
  onvif:
    enabled: bool?
    ws_discovery: bool?
    port: port?
    ptz_step: int(1,16)?
  auth:
    username: str?
    password: password?
  diagnostics:
    debug: bool
    dump_raw: str?
    skip_video_start: bool
    skip_audio_start: bool
image: gimparm/abus-rtsp-bridge-ha
